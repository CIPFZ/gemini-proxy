[package]
name = "gemini-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
# HTTP server
hyper = { version = "1.5", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["io"] }

# HTTP client with SOCKS support
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Date/time
chrono = "0.4"

# URL parsing
url = "2.5"
urlencoding = "2.1"

# Async mutex
parking_lot = "0.12"

# Path helpers
dirs = "5"

[profile.release]
strip = true
lto = true
codegen-units = 1
